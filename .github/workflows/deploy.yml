name: Deploy to EC2

on:
  push:
    branches:
      - main

env:
  APP_DIR: ~/DACS1_backend
  PM2_APP_NAME: backend

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: APP_DIR,PM2_APP_NAME
          script: |
            set -e
            cd $APP_DIR

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building..."
            npm run build

            echo "Restarting app with PM2..."
            pm2 restart $PM2_APP_NAME || pm2 start npm --name $PM2_APP_NAME -- run start:prod

            echo "Deploy complete."
