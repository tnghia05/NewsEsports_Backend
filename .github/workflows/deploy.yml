name: Deploy to EC2 (PM2)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Nếu chưa clone repo lần đầu
            if [ ! -d .git ]; then
              git clone https://github.com/tnghia05/DACS1_backend.git .
            fi

            git fetch --all
            git reset --hard origin/main

            # Tạo .env từ GitHub Secrets (tạo SAU khi pull/reset để tránh bị mất file)
            # Dùng <<'EOF' để tránh shell expansion trong heredoc.
            cat > .env <<'EOF'
            PORT=3000
            MONGODB_URI=${{ secrets.MONGODB_URI }}

            # Auth (Milestone 1)
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}

            # Google login (Milestone 1)
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

            # AI service (Milestone 3)
            AI_SERVICE_URL=${{ secrets.AI_SERVICE_URL }}
            AI_TIMEOUT_MS=${{ secrets.AI_TIMEOUT_MS }}

            VNPAY_TEST_MODE=${{ secrets.VNPAY_TEST_MODE }}
            VNPAY_HOST=${{ secrets.VNPAY_HOST }}
            VNPAY_TMN_CODE=${{ secrets.VNPAY_TMN_CODE }}
            VNPAY_SECURE_SECRET=${{ secrets.VNPAY_SECURE_SECRET }}
            VNPAY_RETURN_URL=${{ secrets.VNPAY_RETURN_URL }}
            VNPAY_ENABLE_LOG=${{ secrets.VNPAY_ENABLE_LOG }}

            # R2 (S3-compatible) storage
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}

            # Matches (Milestone 10)
            MATCH_DATA_PROVIDER=${{ secrets.MATCH_DATA_PROVIDER }}
            PANDASCORE_TOKEN=${{ secrets.PANDASCORE_TOKEN }}
            MATCH_SYNC_INTERVAL_MS=${{ secrets.MATCH_SYNC_INTERVAL_MS }}

            # GRID esports API
            GRID_API_KEY=${{ secrets.GRID_API_KEY }}

            EOF

            # Cài deps + build
            npm ci
            npm run build

            # Cài PM2 nếu chưa có
            command -v pm2 >/dev/null 2>&1 || sudo npm i -g pm2

            # Restart app
            pm2 restart backend || pm2 start dist/main.js --name backend
            pm2 save
